name: Foxvyn GitHub Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foxvyn-metrics
  cancel-in-progress: false

jobs:
  generate:
    name: Generate profile insights
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate most-used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: foxvyn
          filename: metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_colors: github
          plugin_languages_details: percentage

      - name: Generate GitHub achievements
        uses: stalomeow/metrics@edcae0f874d69e509d25ddd5e750a2f41cd54e10
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: foxvyn
          filename: metrics-achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8
          plugin_achievements_secrets: no

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: foxvyn
          filename: metrics-activity.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Jakarta
