    <rect x="730" y="342" width="368" height="164" rx="8" fill="#f7f5f6" stroke="#e0dce1"/>
    <text x="748" y="366" fill="#6e6974" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">// current operating principles</text>
