    </g>
    <path d="M82 486H654" stroke="#dfdbe0" stroke-dasharray="3 6"/>
    <text x="82" y="512" fill="#77717b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">$ build --ideas --ship-solutions</text>
    <rect x="393" y="501" width="8" height="15" rx="1" fill="#d92d4d"><animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/></rect>

