<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Foxvyn, Building ideas into intelligent solutions</title>
  <desc id="desc">A dark terminal-inspired profile banner with red accents, code interface, and a system information panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c10"/><stop offset="0.56" stop-color="#111217"/><stop offset="1" stop-color="#190d12"/></linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5268"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17191f"/><stop offset="1" stop-color="#101116"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#e11d48" stop-opacity=".20"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="frameClip"><rect x="34" y="32" width="1112" height="546" rx="18"/></clipPath>
  </defs>
  <rect width="1180" height="610" rx="22" fill="url(#bg)"/>
  <rect width="1180" height="610" rx="22" fill="url(#grid)"/>
  <circle cx="950" cy="100" r="300" fill="url(#halo)"/>
  <g clip-path="url(#frameClip)">
    <rect x="34" y="32" width="1112" height="546" rx="18" fill="#0c0d11" stroke="#34343d" stroke-width="1.4"/>
    <path d="M34 50Q34 32 52 32H1128Q1146 32 1146 50V82H34Z" fill="#1b1c23"/>
    <path d="M34 82H1146" stroke="#373741"/>
    <circle cx="58" cy="57" r="5.5" fill="#ff5f57"/><circle cx="77" cy="57" r="5.5" fill="#febc2e"/><circle cx="96" cy="57" r="5.5" fill="#28c840"/>
    <rect x="430" y="43" width="320" height="28" rx="8" fill="#101116" stroke="#33343d"/>
    <circle cx="446" cy="57" r="3" fill="#f0445e"/><text x="460" y="61" fill="#a8a9b5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">foxvyn / profile.sys</text>
    <text x="1119" y="61" text-anchor="end" fill="#777985" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">UTF-8  ·  SVG</text>

    <!-- Left identity / code terminal -->
    <rect x="58" y="106" width="626" height="442" rx="12" fill="url(#panel)" stroke="#353640"/>
    <path d="M58 146H684" stroke="#34353f"/>
    <text x="80" y="131" fill="#a4a5b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">TERMINAL  /  IDENTITY</text>
    <circle cx="657" cy="126" r="3.5" fill="#f0445e"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="82" y="185" fill="#ef445d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; whoami</text>
    <text x="82" y="245" fill="#f4f4f6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="700" letter-spacing="-2">FOXVYN</text>
    <rect x="82" y="263" width="54" height="3" rx="1.5" fill="url(#redGlow)"/>
    <text x="82" y="297" fill="#d4d4dc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Building ideas into</text>
    <text x="82" y="321" fill="#d4d4dc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">intelligent solutions<tspan fill="#f0445e">.</tspan></text>
    <text x="82" y="369" fill="#777985" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">FOCUS AREAS</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <rect x="82" y="385" width="172" height="31" rx="7" fill="#24131a" stroke="#733041"/><circle cx="96" cy="400.5" r="3" fill="#ff5268"/><text x="107" y="405" fill="#f2dfe4">Software Engineering</text>
      <rect x="264" y="385" width="74" height="31" rx="7" fill="#24131a" stroke="#733041"/><circle cx="278" cy="400.5" r="3" fill="#ff5268"/><text x="289" y="405" fill="#f2dfe4">AI</text>
      <rect x="348" y="385" width="126" height="31" rx="7" fill="#24131a" stroke="#733041"/><circle cx="362" cy="400.5" r="3" fill="#ff5268"/><text x="373" y="405" fill="#f2dfe4">Cybersecurity</text>
      <rect x="82" y="426" width="190" height="31" rx="7" fill="#24131a" stroke="#733041"/><circle cx="96" cy="441.5" r="3" fill="#ff5268"/><text x="107" y="446" fill="#f2dfe4">Full-Stack Development</text>
    </g>
    <path d="M82 486H654" stroke="#34353f" stroke-dasharray="3 6"/>
    <text x="82" y="512" fill="#777985" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">$ build --ideas --ship-solutions</text>
    <rect x="393" y="501" width="8" height="15" rx="1" fill="#f0445e"><animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/></rect>

    <!-- Right system info panel -->
    <rect x="706" y="106" width="416" height="442" rx="12" fill="#101116" stroke="#353640"/>
    <path d="M706 146H1122" stroke="#34353f"/>
    <text x="730" y="131" fill="#a4a5b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">SYSTEM.INFO</text>
    <text x="1097" y="131" text-anchor="end" fill="#f0445e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">[ ONLINE ]</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text x="730" y="181" fill="#737582">identity</text><text x="1097" y="181" text-anchor="end" fill="#e5e5eb">foxvyn</text><path d="M730 194H1097" stroke="#292a33"/>
      <text x="730" y="222" fill="#737582">domain</text><text x="1097" y="222" text-anchor="end" fill="#e5e5eb">software / intelligence</text><path d="M730 235H1097" stroke="#292a33"/>
      <text x="730" y="263" fill="#737582">interests</text><text x="1097" y="263" text-anchor="end" fill="#e5e5eb">AI + security</text><path d="M730 276H1097" stroke="#292a33"/>
      <text x="730" y="304" fill="#737582">approach</text><text x="1097" y="304" text-anchor="end" fill="#e5e5eb">learn / build / refine</text><path d="M730 317H1097" stroke="#292a33"/>
    </g>
    <rect x="730" y="342" width="368" height="164" rx="8" fill="#17181f" stroke="#30313b"/>
    <text x="748" y="366" fill="#a4a5b2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">// current operating principles</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <circle cx="752" cy="391" r="3" fill="#f0445e"/><text x="764" y="395" fill="#d9d9e1">Build with purpose</text>
      <circle cx="752" cy="419" r="3" fill="#f0445e"/><text x="764" y="423" fill="#d9d9e1">Think in systems</text>
      <circle cx="752" cy="447" r="3" fill="#f0445e"/><text x="764" y="451" fill="#d9d9e1">Keep learning, keep improving</text>
    </g>
    <path d="M748 474H1080" stroke="#34353f"/>
    <text x="748" y="491" fill="#777985" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">status: exploring what's next</text>
    <path d="M34 566H1146" stroke="#e11d48" stroke-opacity=".7" stroke-width="2"/>
    <rect x="34" y="564" width="170" height="4" fill="url(#redGlow)"><animate attributeName="width" values="90;190;90" dur="7s" repeatCount="indefinite"/></rect>
  </g>
  <text x="590" y="598" text-anchor="middle" fill="#686a76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">FOXVYN  /  BUILDING WHAT'S NEXT</text>
</svg>
