<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Foxvyn, Building ideas into intelligent solutions</title>
  <desc id="desc">A light terminal-inspired profile banner with crisp editor chrome, red accents, code interface, and a system information panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf9f8"/><stop offset=".62" stop-color="#f3f2f2"/><stop offset="1" stop-color="#f8e9ed"/></linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4058"/><stop offset="1" stop-color="#be123c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8f7f7"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#e11d48" stop-opacity=".12"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#24242b" stroke-opacity=".045" stroke-width="1"/></pattern>
    <clipPath id="frameClip"><rect x="34" y="32" width="1112" height="546" rx="18"/></clipPath>
  </defs>
  <rect width="1180" height="610" rx="22" fill="url(#bg)"/>
  <rect width="1180" height="610" rx="22" fill="url(#grid)"/>
  <circle cx="950" cy="100" r="300" fill="url(#halo)"/>
