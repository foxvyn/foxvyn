<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">Tio Muhammad Rizky — Foxvyn</title>
<desc id="desc">Animated dark terminal-inspired profile banner. It presents Tio Muhammad Rizky's interests in software engineering, AI, cybersecurity, and full-stack development through a connected systems map.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a10"/><stop offset=".58" stop-color="#11131c"/><stop offset="1" stop-color="#1c0c14"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7186"/><stop offset=".55" stop-color="#f43f5e"/><stop offset="1" stop-color="#a52b4c"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#191c27"/><stop offset="1" stop-color="#10121a"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#f43f5e" stop-opacity=".24"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#cbd5e1" stroke-opacity=".045"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  <clipPath id="frame"><rect x="28" y="24" width="1124" height="562" rx="20"/></clipPath>
</defs>
