    <text x="730" y="131" fill="#6e6974" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">SYSTEM.INFO</text>
    <text x="1097" y="131" text-anchor="end" fill="#c51f42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">[ ONLINE ]</text>
