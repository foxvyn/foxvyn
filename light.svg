      <rect x="264" y="385" width="74" height="31" rx="7" fill="#fff0f3" stroke="#e8a8b5"/><circle cx="278" cy="400.5" r="3" fill="#d92d4d"/><text x="289" y="405" fill="#6c2435">AI</text>
