  <text x="590" y="598" text-anchor="middle" fill="#77717b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">FOXVYN  /  BUILDING WHAT'S NEXT</text>
