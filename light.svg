    </g>
    <path d="M748 474H1080" stroke="#ded9de"/>
    <text x="748" y="491" fill="#77717b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">status: exploring what's next</text>
