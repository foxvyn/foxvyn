      <circle cx="752" cy="391" r="3" fill="#d92d4d"/><text x="764" y="395" fill="#45414a">Build with purpose</text>
      <circle cx="752" cy="419" r="3" fill="#d92d4d"/><text x="764" y="423" fill="#45414a">Think in systems</text>
